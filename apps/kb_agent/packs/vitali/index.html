<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vitali Suites</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{--bg:#0b1020;--panel:#12192a;--panel2:#0f1524;--panel3:#10182a;--panel4:#0c1322;--text:#e7ecf3;--muted:#98a5bd;--border:#25304a;--border2:#31405f;--accent:#7cc4ff;--accent2:#122540;--user:#17304f;--assistant:#101a2f;--chip:#18233b;--ok:#12331d;--warn:#3a2d14;--shadow:0 12px 34px rgba(0,0,0,.35);--shadow2:0 6px 18px rgba(0,0,0,.28)}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
    .app{display:grid;grid-template-columns:280px minmax(0,1fr) auto;height:100vh;min-height:0;transition:grid-template-columns .18s ease}.app.left-collapsed{grid-template-columns:0 minmax(0,1fr) auto}.leftbar{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;background:linear-gradient(180deg,#0e1525 0%,#0b1020 100%);border-right:1px solid var(--border);overflow:hidden;transition:opacity .18s ease,transform .18s ease}.app.left-collapsed .leftbar{opacity:0;transform:translateX(-10px);border-right-color:transparent}.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;height:100vh;border-right:1px solid var(--border)}
    .topbar,.sidehead,.lefthead,.lefttools{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel)} .sidehead{flex:0 0 auto;position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--panel) 0%,#11192d 100%)}.lefthead{background:linear-gradient(180deg,var(--panel) 0%,#11192d 100%)}.lefttools{background:transparent}.title{font-size:14px;font-weight:800}.sub,.meta{font-size:12px;color:var(--muted);margin-top:4px}
    .topline{display:flex;justify-content:space-between;gap:12px;align-items:start}.topline-main{display:flex;gap:10px;align-items:start}.top-actions{display:flex;gap:8px;align-items:center}.left-toggle{background:var(--panel2);color:var(--text);position:relative;z-index:1}.profile-name{font-size:15px;font-weight:900}.profile-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#11213b;border:1px solid #31405f;color:#9fd5ff;font-size:11px;margin-top:10px}.conversations{min-height:0;overflow-y:scroll;overflow-x:hidden;padding:12px;scrollbar-width:thin;scrollbar-color:#3a4a6d transparent}.conversations::-webkit-scrollbar{width:10px}.conversations::-webkit-scrollbar-track{background:transparent}.conversations::-webkit-scrollbar-thumb{background:#334261;border-radius:999px;border:2px solid transparent;background-clip:padding-box}.conv-item{width:100%;text-align:left;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:14px;padding:12px 12px;height:auto;display:grid;gap:6px}.conv-item + .conv-item{margin-top:10px}.conv-item:hover{border-color:#42608f;background:#0f1b31}.conv-item.active{border-color:#7cc4ff;background:#122540}.conv-title{font-size:13px;font-weight:800;line-height:1.35}.conv-meta{font-size:11px;color:var(--muted)}
    .messages{min-height:0;overflow-y:scroll;overflow-x:hidden;padding:18px;display:grid;gap:16px;align-content:start;scrollbar-width:thin;scrollbar-color:#3a4a6d transparent}.messages::-webkit-scrollbar{width:10px}.messages::-webkit-scrollbar-track{background:transparent}.messages::-webkit-scrollbar-thumb{background:#334261;border-radius:999px;border:2px solid transparent;background-clip:padding-box}.turn{display:grid;gap:10px}
    .msg{max-width:920px;border:1px solid var(--border);border-radius:14px;padding:14px 16px;line-height:1.65;box-shadow:var(--shadow)} .msg.user{justify-self:end;background:var(--user)} .msg.assistant{justify-self:start;background:var(--assistant);cursor:pointer;position:relative} .msg.assistant.selected{outline:2px solid var(--accent);background:#10213d}
    .role{font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:700;letter-spacing:.04em}.body h1,.body h2,.body h3{line-height:1.2}.body h1{font-size:22px}.body h2{font-size:18px}.body h3{font-size:15px}
    .body code{background:#0d1424;border:1px solid #22304b;padding:2px 6px;border-radius:6px}.body pre{overflow:auto;background:#0d1424;border:1px solid #22304b;padding:12px;border-radius:12px}
    .turnmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{background:var(--chip);border:1px solid #2a395b;color:#c6d5e8;border-radius:999px;padding:4px 8px;font-size:11px}.pill.link{background:var(--accent2);border-color:#34527b;color:#9fd5ff}
    .composer{padding:14px;border-top:1px solid var(--border);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px} textarea{resize:none;height:92px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);padding:12px;outline:none} textarea:focus{border-color:var(--accent)}
    button{border:1px solid var(--border);background:var(--accent);color:#07111f;font-weight:800;border-radius:12px;padding:0 16px;cursor:pointer;height:38px} button.secondary{background:var(--panel2);color:var(--text)} button[disabled]{opacity:.6;cursor:wait}
    .side-shell{position:relative;height:100vh;min-height:0;display:flex}.sidebar-toggle{position:absolute;left:-42px;top:16px;z-index:5;width:32px;height:32px;border-radius:10px;background:var(--panel);color:var(--text);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
    .side{width:0;overflow:hidden;transition:width .18s ease;border-left:1px solid transparent;background:var(--panel);height:100vh;min-height:0;display:flex}.side.open{width:460px;border-left-color:var(--border)}.side-inner{display:flex;flex-direction:column;flex:1 1 auto;height:100%;min-height:0;overflow:hidden;background:linear-gradient(180deg,#12192a 0%,#0f1524 100%)}.sidebody{flex:1 1 auto;min-height:0;overflow-y:scroll;overflow-x:hidden;padding:16px;display:block;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#3a4a6d transparent}.sidebody::-webkit-scrollbar{width:10px}.sidebody::-webkit-scrollbar-track{background:transparent}.sidebody::-webkit-scrollbar-thumb{background:#334261;border-radius:999px;border:2px solid transparent;background-clip:padding-box}
    .empty{color:var(--muted);font-size:14px}.section{border:1px solid var(--border2);border-radius:16px;background:linear-gradient(180deg,#11192d 0%,#0d1526 100%);overflow:hidden;box-shadow:var(--shadow2)}.section + .section{margin-top:14px}.section-head{padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;background:rgba(255,255,255,.02)}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#a8b7d4;font-weight:900}.section-body{display:none;padding:14px}.section.open .section-body{display:block}
    .summary-grid{display:grid;gap:10px}.summary-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat-card{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--panel4)}.stat-value{font-size:16px;font-weight:900}.stat-label{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--chip);border:1px solid #2a395b;color:#c6d5e8;border-radius:999px;padding:4px 8px;font-size:11px}.chip.ok{background:var(--ok);border-color:#1f5831}.chip.warn{background:var(--warn);border-color:#6c5627}
    .atom-row{border:1px solid var(--border);border-radius:14px;padding:12px;background:linear-gradient(180deg,#0e1628 0%,#0c1424 100%);display:grid;gap:9px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;box-shadow:var(--shadow2)}.atom-row:hover{border-color:#4a6494;background:linear-gradient(180deg,#12203a 0%,#0e1a31 100%);transform:translateY(-1px)}.atom-topline{display:flex;justify-content:space-between;gap:10px;align-items:start}.atom-name{font-size:13px;font-weight:850;line-height:1.35}.atom-sub{font-size:11px;color:var(--muted)}.atom-score{font-size:11px;color:#9fd5ff;background:#10213d;border:1px solid #34527b;border-radius:999px;padding:4px 8px;white-space:nowrap}.atom-linkhint{font-size:11px;color:#9fd5ff}
    .tag-group{display:grid;gap:8px}.tag-group-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#0d1526}.toc-summary{display:grid;gap:8px;font-size:13px}.toc-line{padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:#0d1526}.soft-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .linkish{background:var(--accent2);color:#9fd5ff;border:1px solid #34527b;border-radius:999px;padding:6px 10px;font:12px ui-monospace,monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.refs{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}.atom-link{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;margin:0 2px;border-radius:999px;border:1px solid #34527b;background:#122540;color:#9fd5ff;text-decoration:none;font:12px ui-monospace,monospace;cursor:pointer}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}.modal-backdrop.open{display:flex}.modal{width:min(900px,100%);max-height:85vh;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);display:grid;grid-template-rows:auto minmax(0,1fr)}.modal-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}.modal-body{padding:16px;overflow:auto;min-height:0}.close{background:transparent;color:var(--text);border:1px solid var(--border);height:34px;min-width:34px;padding:0 10px}
    @media (max-width:1200px){.app{grid-template-columns:250px minmax(0,1fr) auto}.side.open{width:420px}} @media (max-width:1024px){.app{grid-template-columns:1fr}.leftbar{display:none}.side-shell{position:fixed;right:0;top:0;z-index:20}.side.open{width:min(92vw,460px)}.sidebar-toggle{left:-38px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="leftbar">
    <div class="lefthead">
      <div class="title">Vitali Suites</div>
      <div class="sub">Senior Living de lujo.</div>
      <div class="profile-name" id="profileName">Perfil Vitali</div>
      <div class="profile-pill" id="identityPill">anon</div>
    </div>
    <div class="lefttools">
      <button class="secondary" id="newChatBtn" style="width:100%">＋ Nuevo chat</button>
      <div class="meta" id="identityMeta"></div>
    </div>
    <div class="conversations" id="conversationsList">
      <div class="empty">Cargando conversaciones...</div>
    </div>
  </aside>
  <section class="chat">
    <div class="topbar">
      <div class="topline">
        <div class="topline-main">
          <button class="left-toggle" id="leftbarToggle">✕</button>
          <div>
            <div class="title">Chat</div>
            <div class="sub">Selecciona una respuesta para inspeccionar su mesa.</div>
          </div>
        </div>
        <div class="top-actions"></div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="input" placeholder="Ej: ¿Qué ofrece Vitali Suites para el senior living?"></textarea>
      <button id="send">Enviar</button>
    </div>
  </section>

  <div class="side-shell">
    <button class="sidebar-toggle" id="sidebarToggle" title="Abrir/cerrar contexto">◧</button>
    <aside class="side" id="sidebar">
      <div class="side-inner">
        <div class="sidehead">
          <div class="title">Inspector de mesa</div>
          <div class="meta" id="sideMeta">Selecciona una respuesta del asistente.</div>
        </div>
        <div class="sidebody" id="sideBody">
          <div class="empty">Aquí aparecerá el contexto versionado de la respuesta seleccionada.</div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><div class="title" id="modalTitle">Detalle</div><button class="close" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div></div></div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const newChatBtn = document.getElementById('newChatBtn');
const appShell = document.querySelector('.app');
const conversationsListEl = document.getElementById('conversationsList');
const profileNameEl = document.getElementById('profileName');
const identityPillEl = document.getElementById('identityPill');
const leftbarToggle = document.getElementById('leftbarToggle');
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const sideMeta = document.getElementById('sideMeta');
const sideBody = document.getElementById('sideBody');
const identityMeta = document.getElementById('identityMeta');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');
const atomRegex = /\b(atom-[a-z0-9-]+)\b/g;
marked.setOptions({gfm:true, breaks:true});

let userId = localStorage.getItem('kb_chat_user_id') || `user-${crypto.randomUUID()}`;
let conversationId = localStorage.getItem('kb_chat_conversation_id') || `conv-${crypto.randomUUID()}`;
let turns = [];
let selectedTurnId = null;
localStorage.setItem('kb_chat_user_id', userId);
localStorage.setItem('kb_chat_conversation_id', conversationId);

function escapeHtml(s=''){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
function enhanceAtomRefs(html){return html.replace(atomRegex,'<a class="atom-link" data-atom="$1">$1</a>');}
function extractRefs(text){return [...new Set((text.match(atomRegex)||[]))];}
function openSidebar(){sidebar.classList.add('open');} function toggleSidebar(){sidebar.classList.toggle('open');}
function openModal(title, html){modalTitle.textContent=title;modalBody.innerHTML=html;modalBackdrop.classList.add('open');} function closeModal(){modalBackdrop.classList.remove('open');}
function detectProfileName(){ const stored = localStorage.getItem('kb_chat_detected_name'); if(stored) return stored; return 'Usuario anónimo'; }
function applyLeftbarState(){ const collapsed = localStorage.getItem('kb_chat_leftbar_collapsed') === '1'; appShell.classList.toggle('left-collapsed', collapsed); leftbarToggle.textContent = collapsed ? '☰' : '✕'; }
function toggleLeftbar(){ const collapsed = localStorage.getItem('kb_chat_leftbar_collapsed') === '1'; localStorage.setItem('kb_chat_leftbar_collapsed', collapsed ? '0' : '1'); applyLeftbarState(); }
function updateIdentityMeta(){identityMeta.textContent=`user_id: ${userId} · conversation_id: ${conversationId}`; profileNameEl.textContent = detectProfileName(); identityPillEl.textContent = userId.slice(0,18);}

function renderTurns(){
  messagesEl.innerHTML='';
  for(const turn of turns){
    const refs = extractRefs(turn.assistant_message || '');
    const selected = turn.turn_id === selectedTurnId;
    const turnEl = document.createElement('div');
    turnEl.className='turn';
    turnEl.innerHTML=`<div class="msg user"><div class="role">usuario</div><div class="body">${enhanceAtomRefs(marked.parse(turn.user_message||''))}</div></div><div class="msg assistant ${selected?'selected':''}" data-turn-id="${turn.turn_id}"><div class="role">asistente · ${turn.turn_id}</div><div class="body">${enhanceAtomRefs(marked.parse(turn.assistant_message||''))}</div><div class="turnmeta"><span class="pill">${(turn.mesa?.atom_ids||[]).length} atoms</span><span class="pill">${(turn.mesa?.include_tags||[]).length} tags</span><span class="pill">+${(turn.mesa?.added_atom_ids||[]).length}</span><span class="pill">=${(turn.mesa?.retained_atom_ids||[]).length}</span><span class="pill">-${(turn.mesa?.removed_atom_ids||[]).length}</span><span class="pill link">ver mesa</span></div>${refs.length?`<div class="refs">${refs.map(r=>`<button class="linkish" data-atom="${r}" data-turn-id="${turn.turn_id}">${r}</button>`).join('')}</div>`:''}</div>`;
    messagesEl.appendChild(turnEl);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function summarizeTags(items){const counts={}; for(const item of items||[]){for(const tag of item.tags||[]){counts[tag]=(counts[tag]||0)+1;}} return Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));}

function renderTurnInspector(turn, focusAtomId=null){
  if(!turn){sideMeta.textContent='Selecciona una respuesta del asistente.';sideBody.innerHTML='<div class="empty">Aquí aparecerá el contexto versionado de la respuesta seleccionada.</div>';return;}
  const mesa = turn.mesa || {};
  sideMeta.textContent = `${turn.turn_id} · ${mesa.mesa_id} · ${(mesa.atom_ids||[]).length} atoms`;
  const tagCounts = summarizeTags(mesa.items||[]);
  const atomRows=(mesa.items||[]).map(item=>`<div class="atom-row" id="atom-row-${item.atom_id}" data-open-atom="${item.atom_id}"><div class="atom-topline"><div class="atom-name">${escapeHtml(item.title)}</div><div class="atom-score">score ${item.score}</div></div><div class="atom-sub">${escapeHtml(item.atom_id)} · ${escapeHtml(item.role)}</div><div class="chips">${(item.tags||[]).map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')}</div><div class="refs"><span class="atom-linkhint">abrir atom completo</span></div></div>`).join('');
  sideBody.innerHTML=`<div class="section open"><div class="section-head" data-toggle-section><div><div class="section-title">Resumen</div><div class="meta">Mesa asociada a la respuesta seleccionada</div></div><div>▾</div></div><div class="section-body"><div class="summary-stats"><div class="stat-card"><div class="stat-value">${(mesa.atom_ids||[]).length}</div><div class="stat-label">atoms</div></div><div class="stat-card"><div class="stat-value">${(mesa.include_tags||[]).length}</div><div class="stat-label">tags</div></div><div class="stat-card"><div class="stat-value">${(mesa.reasoning_summary||[]).length}</div><div class="stat-label">steps</div></div></div><div class="summary-grid" style="margin-top:12px"><div><div class="soft-label">Pregunta</div><div>${escapeHtml(turn.user_message||'')}</div></div><div><div class="soft-label">Tags activos</div><div class="chips" style="margin-top:6px">${(mesa.include_tags||[]).map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')||'<span class="empty">sin tags</span>'}</div></div><div><div class="soft-label">Added</div>${(mesa.added_atom_ids||[]).map(x=>`<span class="chip">${escapeHtml(x)}</span>`).join(' ')||'<span class="empty">ninguno</span>'}</div><div><div class="soft-label">Retained</div>${(mesa.retained_atom_ids||[]).map(x=>`<span class="chip ok">${escapeHtml(x)}</span>`).join(' ')||'<span class="empty">ninguno</span>'}</div><div><div class="soft-label">Removed</div>${(mesa.removed_atom_ids||[]).map(x=>`<span class="chip warn">${escapeHtml(x)}</span>`).join(' ')||'<span class="empty">ninguno</span>'}</div></div></div><div class="section"><div class="section-head" data-toggle-section><div><div class="section-title">Train of thought</div><div class="meta">Resumen del razonamiento bibliotecario</div></div><div>▸</div></div><div class="section-body"><div class="toc-summary">${(mesa.reasoning_summary||[]).map(line=>`<div class="toc-line">${escapeHtml(line)}</div>`).join('')||'<div class="empty">sin resumen</div>'}</div><div class="refs" style="margin-top:12px"><button class="linkish" data-open-reasoning="${turn.turn_id}">ver log completo</button></div></div></div><div class="section"><div class="section-head" data-toggle-section><div><div class="section-title">Atoms</div><div class="meta">Vista compacta del contexto atómico</div></div><div>▸</div></div><div class="section-body"><div class="summary-grid" style="margin-bottom:12px"><div><div class="soft-label">Top tags</div></div><div class="tag-group">${tagCounts.slice(0,8).map(([tag,count])=>`<div class="tag-group-row"><span>${escapeHtml(tag)}</span><span>${count}</span></div>`).join('')||'<div class="empty">sin tags</div>'}</div></div><div class="summary-grid">${atomRows}</div></div></div>`;
  openSidebar();
  if(focusAtomId){setTimeout(()=>{const el=document.getElementById(`atom-row-${focusAtomId}`); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});},0);}
}

function selectTurn(turnId, focusAtomId=null){selectedTurnId=turnId; renderTurns(); const turn=turns.find(t=>t.turn_id===turnId); renderTurnInspector(turn, focusAtomId);}
async function openAtomModal(atomId){const res=await fetch(`/api/atom/${atomId}`); if(!res.ok){openModal('Atom','<div class="empty">No se pudo cargar el atom.</div>');return;} const atom=await res.json(); openModal(atom.id,`<div class="summary-grid"><div><strong>Título:</strong> ${escapeHtml(atom.title||'')}</div><div><strong>Path:</strong> <code>${escapeHtml(atom.path||'')}</code></div><div><strong>Tags:</strong> <div class="chips" style="margin-top:6px">${(atom.tags||[]).map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')}</div></div><div><strong>Pregunta:</strong> ${escapeHtml(atom.question||'-')}</div><div><strong>Respuesta:</strong> ${marked.parse(atom.answer||'_Sin respuesta_')}</div><div><strong>Procedencia:</strong> ${marked.parse(atom.provenance||atom.provenance_field||'_Sin procedencia_')}</div></div>`);}
function openReasoningModal(turnId){const turn=turns.find(t=>t.turn_id===turnId); if(!turn) return; openModal(`Reasoning · ${turnId}`,`<pre>${escapeHtml(JSON.stringify(turn.mesa?.reasoning_log||[],null,2))}</pre>`);}

function renderConversationList(conversations){
  if(!conversations.length){ conversationsListEl.innerHTML = '<div class="empty">Todavía no hay conversaciones guardadas.</div>'; return; }
  conversationsListEl.innerHTML = conversations.map(conv => {
    const active = conv.conversation_id === conversationId;
    const title = conv.title || 'Chat sin título';
    const meta = `${(conv.turn_count || 0)} turnos`;
    return `<button class="conv-item ${active ? 'active' : ''}" data-conversation-id="${conv.conversation_id}"><div class="conv-title">${escapeHtml(title)}</div><div class="conv-meta">${escapeHtml(meta)}</div><div class="conv-meta">${escapeHtml(conv.updated_at || '')}</div></button>`;
  }).join('');
}

async function refreshConversationList(){
  updateIdentityMeta();
  try{
    const res = await fetch(`/api/user/${userId}/conversations`);
    if(!res.ok){ conversationsListEl.innerHTML = '<div class="empty">No se pudo cargar la lista.</div>'; return; }
    const data = await res.json();
    renderConversationList(data.conversations || []);
  }catch(_err){ conversationsListEl.innerHTML = '<div class="empty">No se pudo cargar la lista.</div>'; }
}

async function loadConversation(){
  updateIdentityMeta();
  try{
    const res = await fetch(`/api/conversation/${conversationId}`);
    if(!res.ok){ await refreshConversationList(); return; }
    const data = await res.json();
    turns = data.turns || [];
    if(turns.length){ selectTurn(turns[turns.length-1].turn_id); } else { renderTurns(); renderTurnInspector(null); }
    await refreshConversationList();
  }catch(_err){ await refreshConversationList(); }
}

async function loadConversationById(nextConversationId){
  conversationId = nextConversationId;
  localStorage.setItem('kb_chat_conversation_id', conversationId);
  turns = [];
  selectedTurnId = null;
  renderTurns();
  renderTurnInspector(null);
  await loadConversation();
}

async function startNewConversation(){
  conversationId = `conv-${crypto.randomUUID()}`;
  localStorage.setItem('kb_chat_conversation_id', conversationId);
  turns = [];
  selectedTurnId = null;
  updateIdentityMeta();
  renderTurns();
  renderTurnInspector(null);
  await refreshConversationList();
}

async function sendMessage(){
  const message=inputEl.value.trim(); if(!message) return;
  inputEl.value=''; sendBtn.disabled=true;
  const ghostId=`ghost-${Date.now()}`;
  turns.push({turn_id:ghostId,user_message:message,assistant_message:'_Compilando mesa y respondiendo..._',mesa:{atom_ids:[],include_tags:[],added_atom_ids:[],retained_atom_ids:[],removed_atom_ids:[]},pending:true});
  selectedTurnId=ghostId; renderTurns();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,user_id:userId,conversation_id:conversationId})});
    const data=await res.json();
    userId = data.user_id; conversationId = data.conversation_id;
    localStorage.setItem('kb_chat_user_id', userId); localStorage.setItem('kb_chat_conversation_id', conversationId);
    turns=turns.filter(t=>t.turn_id!==ghostId); turns.push(data.turn); updateIdentityMeta(); selectTurn(data.turn.turn_id); await refreshConversationList();
  }catch(err){turns=turns.filter(t=>t.turn_id!==ghostId); turns.push({turn_id:`err-${Date.now()}`,user_message:message,assistant_message:`Error: ${err.message||err}`,mesa:{atom_ids:[],include_tags:[],added_atom_ids:[],retained_atom_ids:[],removed_atom_ids:[]}}); renderTurns();}
  finally{sendBtn.disabled=false; inputEl.focus();}
}

sidebarToggle.onclick=toggleSidebar; leftbarToggle.onclick=toggleLeftbar; sendBtn.onclick=sendMessage; newChatBtn.onclick=()=>{startNewConversation();}; inputEl.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}); modalClose.onclick=closeModal; modalBackdrop.addEventListener('click',(e)=>{if(e.target===modalBackdrop) closeModal();});

document.addEventListener('click',(e)=>{const convItem=e.target.closest('[data-conversation-id]'); if(convItem){loadConversationById(convItem.getAttribute('data-conversation-id')); return;} const openAtom=e.target.closest('[data-open-atom]'); if(openAtom){openAtomModal(openAtom.getAttribute('data-open-atom')); return;} const atomRef=e.target.closest('[data-atom]'); if(atomRef){const atomId=atomRef.getAttribute('data-atom'); const turnId=atomRef.getAttribute('data-turn-id')||selectedTurnId; if(turnId) selectTurn(turnId, atomId); openAtomModal(atomId); return;} const toggle=e.target.closest('[data-toggle-section]'); if(toggle){const section=toggle.closest('.section'); section.classList.toggle('open'); toggle.lastElementChild.textContent = section.classList.contains('open') ? '▾' : '▸'; return;} const openReasoning=e.target.closest('[data-open-reasoning]'); if(openReasoning){openReasoningModal(openReasoning.getAttribute('data-open-reasoning')); return;} const turnCard=e.target.closest('.msg.assistant[data-turn-id]'); if(turnCard){selectTurn(turnCard.getAttribute('data-turn-id')); return;}});

updateIdentityMeta();
applyLeftbarState();
turns.push({turn_id:'turn-000',user_message:'',assistant_message:'Hola. Pregúntame algo sobre Vitali Suites. Cada respuesta queda ligada a su propia mesa y puedes inspeccionarla a la derecha.',mesa:{mesa_id:'mesa-demo',atom_ids:[],include_tags:[],added_atom_ids:[],retained_atom_ids:[],removed_atom_ids:[],reasoning_summary:[],reasoning_log:[],items:[]}});
renderTurns();
refreshConversationList();
loadConversation();
</script>
</body>
</html>
