# Preguntas de un estudiante sobre la teoría APOS (Arnon et al. 2014) para el benchmark de
# selección de contexto. `expected_atom_ids` son ids reales de `kbs/apos/knowledge/**`;
# `expected_tags` son tags `topic:*` que debería traer al menos un átomo del top-k.
questions:
  - id: q01-accion
    question: "¿Qué es una Acción en la teoría APOS y por qué necesita guía externa paso a paso?"
    expected_atom_ids:
      - atom-action-is-a-core-mental-structure-in-apos
      - atom-action-requires-explicit-step-by-step-external-guidance
    expected_tags: [topic:action]

  - id: q02-proceso
    question: "¿En qué se diferencia un Proceso de una Acción? ¿Por qué se dice que ya no hace falta ejecutar cada paso?"
    expected_atom_ids:
      - atom-process-allows-mental-control-without-executing-each-step
      - atom-process-is-a-core-mental-structure-in-apos
    expected_tags: [topic:process]

  - id: q03-objeto
    question: "¿Qué significa que un estudiante tenga una concepción de Objeto de una función?"
    expected_atom_ids:
      - atom-object-is-a-core-mental-structure-in-apos
      - atom-function-object-conception-supports-sets-operations-and-limits-of-functions
    expected_tags: [topic:object]

  - id: q04-esquema
    question: "¿Qué es un Esquema en APOS y qué lo hace coherente?"
    expected_atom_ids:
      - atom-schema-is-a-coherent-framework-of-linked-structures
      - atom-schema-is-a-core-mental-structure-in-apos
      - atom-schema-coherence-determines-what-falls-within-its-scope
    expected_tags: [topic:schema]

  - id: q05-encapsulacion
    question: "¿Qué es la encapsulación y por qué es tan difícil para los estudiantes?"
    expected_atom_ids:
      - atom-encapsulation-treats-a-process-as-a-static-entity
      - atom-encapsulation-is-reported-as-one-of-the-most-difficult-mechanisms
    expected_tags: [topic:encapsulation]

  - id: q06-desencapsulacion
    question: "¿Cómo puede un estudiante volver desde un objeto al proceso que lo originó? ¿Eso es la desencapsulación?"
    expected_atom_ids:
      - atom-de-encapsulation-recovers-the-underlying-process-of-an-object
    expected_tags: [topic:de-encapsulation]

  - id: q07-totalidad
    question: "¿Qué es la etapa de Totalidad y por qué la proponen entre Proceso y Objeto?"
    expected_atom_ids:
      - atom-totality-is-proposed-to-explain-difficulties-between-process-and-object
      - atom-totality-is-treated-as-a-possible-additional-stage
    expected_tags: [topic:totality]

  - id: q08-interiorizacion
    question: "¿Qué es la interiorización y cómo convierte una acción material en un proceso mental?"
    expected_atom_ids:
      - atom-interiorization-translates-material-actions-into-processes
      - atom-apos-uses-specific-mechanisms-to-explain-construction
    expected_tags: [topic:interiorization]

  - id: q09-coordinacion
    question: "¿Qué papel juega la coordinación de procesos para construir nuevos procesos u objetos?"
    expected_atom_ids:
      - atom-coordination-combines-processes-to-build-new-objects-or-processes
    expected_tags: [topic:coordination]

  - id: q10-reversion
    question: "¿Cómo explica APOS la construcción de la función inversa mediante la reversión de un proceso?"
    expected_atom_ids:
      - atom-reversal-is-central-for-inverses-and-related-constructions
      - atom-reversal-can-operate-after-de-encapsulation
    expected_tags: [topic:reversal]

  - id: q11-tematizacion
    question: "¿Qué quiere decir que un esquema se tematiza y pasa a ser un objeto?"
    expected_atom_ids:
      - atom-thematization-turns-a-schema-into-an-object
      - atom-schemas-can-develop-interact-and-be-thematized
    expected_tags: [topic:thematization]

  - id: q12-descomposicion-genetica
    question: "¿Qué es una descomposición genética? ¿Hay una sola para cada concepto matemático?"
