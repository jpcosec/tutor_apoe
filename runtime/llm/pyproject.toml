[project]
name = "tutor-llm"
version = "0.1.0"
description = "Spec 04: configuración y conformidad de Pydantic AI (sustrato del bucle)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pydantic-ai-slim[openai,bedrock,retries]>=1.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
