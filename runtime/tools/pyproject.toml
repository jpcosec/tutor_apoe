[project]
name = "tutor-tools"
version = "0.1.0"
description = "Spec 03 (mínimo): contrato de tool, catálogo, ToolRunner, check-kb y la tool genérica registrar_evento"
requires-python = ">=3.12"
dependencies = ["tutor-ontology", "tutor-kb", "pydantic>=2.7", "pydantic-ai-slim>=1.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools"]
