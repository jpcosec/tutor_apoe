[project]
name = "tutor-context"
version = "0.1.0"
description = "Spec 14: el contexto del flujo agéntico, su ruteador por rol y su proyección determinista"
requires-python = ">=3.12"
dependencies = ["tutor-ontology", "tutor-kb", "tutor-agents", "tutor-tools", "tutor-semantics", "tutor-llm", "pydantic>=2.7", "pydantic-ai-slim>=1.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context"]
