[project]
name = "tutor-cognitive"
version = "0.1.0"
description = "Canonical model: neutral DTOs and Protocols for world, machine, action, actor, goal, process, knowledge, coordination"
requires-python = ">=3.12"
dependencies = [
    "tutor-ontology",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive"]