[project]
name = "tutor-agents"
version = "0.1.0"
description = "Spec 05: declaración, compilación de instrucciones desde la KB y ejecución de agentes sobre Pydantic AI"
requires-python = ">=3.12"
dependencies = ["tutor-kb", "tutor-llm", "pydantic>=2.7", "pydantic-ai-slim>=1.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
